[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "Cerberus-Game"
version = "0.1.3"
description = "Terminal entrypoint for Cerberus"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
]

[project.scripts]
Cerberus = "Cerberus:main"

[tool.setuptools]
py-modules = ["Cerberus"]

[tool.setuptools.packages.find]
where = ["."]
include = ["Game*"]
