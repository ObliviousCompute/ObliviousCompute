[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icbm-game"
version = "0.1.0"
description = "Interactive Consistency Broadcast Machine"
requires-python = ">=3.10"

[project.scripts]
icbm = "ICBM:main"

[tool.setuptools]
py-modules = ["ICBM"]

[tool.setuptools.packages.find]
where = ["."]
include = ["Payload*"]
